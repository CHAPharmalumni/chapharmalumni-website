<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123f64">
  <title>차 의과학대학교 약학대학 총동문회</title>
  <link rel="icon" href="assets/cha-seal.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="board.css">
</head>
<body data-page="news">
<div id="site-header"></div>
<main id="main" class="sub-main">
<section class="page-head"><div class="wrap"><p class="eyebrow">ADMIN</p><h1 id="write-title">글쓰기</h1><p>등록된 임원 계정만 글을 쓰고 고칠 수 있습니다.</p></div></section>
<section class="wrap write-wrap">
  <div id="no-permission" class="board-empty" hidden>글쓰기 권한이 없습니다. 맨 아래 「관리자 로그인」에서 임원 구글 계정으로 로그인해 주세요.</div>
  <form id="write-form" class="write-form" hidden>
    <label>게시판<select name="board" id="board-select" required></select></label>
    <label>제목<input name="title" maxlength="120" required placeholder="제목을 입력해 주세요"></label>
    <label>본문<textarea name="body" rows="14" placeholder="내용을 입력해 주세요. 빈 줄을 넣으면 문단이 나뉘고, https:// 로 시작하는 주소는 링크가 됩니다."></textarea></label>
    <div class="photo-field"><span>사진</span>
      <div class="photo-list" id="photo-list"></div>
      <label class="photo-add"><svg><use href="#i-image"/></svg>사진 추가<input type="file" id="photo-input" accept="image/*" multiple hidden></label>
      <small>사진은 긴 쪽 1600px로 줄여서 올립니다. 첫 사진이 갤러리 대표 사진이 됩니다.</small>
    </div>
    <label class="check"><input type="checkbox" name="pinned"> 목록 맨 위에 고정</label>
    <p class="form-error" id="write-error" role="alert"></p>
    <div class="post-actions"><a class="outline-button" id="cancel-link" href="board.html?g=news">취소</a><button class="dialog-primary" type="submit" id="save-button">올리기</button></div>
  </form>
</section>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/vendor/supabase-js-2.119.0.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/write.js"></script>
</body>
</html>
